<!DOCTYPE html>
<html lang="en">
<head>
    <title>Forgot Password - Heart Disease Prediction</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        :root {
            --primary: #0d9488;
            --primary-hover: #0f766e;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --bg-main: linear-gradient(135deg, #fff7c2, #c0ebe6);
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            font-size: 16px;
            margin: 0;
            color: var(--text-main);
        }

        .split-container {
            display: flex;
            min-height: 100vh;
            background: var(--bg-main);
        }

        .left-panel,
        .right-panel {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2.5rem;
        }

        .left-panel {
            text-align: center;
        }

        .left-panel img {
            width: 250px;
            max-width: 100%;
            margin-bottom: 1rem;
        }

        .left-panel h4 {
            font-weight: 600;
        }

        .form-card {
            background: linear-gradient(135deg, #f8fafc, #ffffff);
            padding: 2.5rem;
            border-radius: 14px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.08);
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }

        .form-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.12);
        }

        .form-card h2 {
            text-align: center;
            margin-bottom: 0.4rem;
            font-weight: 600;
        }

        .form-card p {
            text-align: center;
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 1.8rem;
        }

        .form-label {
            font-size: 14px;
            margin-bottom: 6px;
        }

        .form-control {
            height: 44px;
            font-size: 14px;
            border-radius: 8px;
        }

        .form-control:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(13,148,136,0.15);
        }

        .btn-primary {
            width: 100%;
            padding: 10px;
            font-size: 15px;
            border-radius: 10px;
            background-color: var(--primary);
            border: none;
            transition: all 0.2s ease;
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
            transform: translateY(-1px);
        }

        .form-text {
            font-size: 13px;
            text-align: center;
            margin-top: 1rem;
            color: var(--text-muted);
        }

        .form-text a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
        }

        .form-text a:hover {
            text-decoration: underline;
        }

        .error-text {
            color: #dc3545;
            text-align: center;
            margin-top: 1rem;
            font-size: 13px;
        }

        @media (max-width: 768px) {
            .split-container {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

<div class="split-container">

    <!-- LEFT PANEL -->
    <section class="left-panel">
        <div>
            <img src="https://i.pinimg.com/564x/34/e5/99/34e5991f23d7d019220e5e8b311af0ba.jpg" alt="Heart Icon">
            <h4>Heart Disease Prediction</h4>
            <p class="form-text">Account recovery made secure</p>
        </div>
    </section>

    <!-- RIGHT PANEL -->
    <section class="right-panel">
        <div class="form-card">

            <h2>Reset Password</h2>
            <p>Enter your registered details to generate a temporary password.</p>

            <form action="/forgot" method="POST">
                <div class="mb-3">
                    <label class="form-label">Username</label>
                    <input type="text" name="un" class="form-control" placeholder="Enter username" required>
                </div>

                <div class="mb-4">
                    <label class="form-label">Email Address</label>
                    <input type="email" name="em" class="form-control" placeholder="Enter email" required>
                </div>

                <button type="submit" class="btn btn-primary">
                    Generate New Password
                </button>
            </form>

            <div class="form-text">
                A secure temporary password will be emailed to you.
            </div>

            <div class="form-text">
                Remembered your password?
                <a href="{{ url_for('login') }}">Back to login</a>
            </div>

            {% if msg %}
            <div class="error-text">
                {{ msg }}
            </div>
            {% endif %}

        </div>
    </section>

</div>

</body>
</html>
