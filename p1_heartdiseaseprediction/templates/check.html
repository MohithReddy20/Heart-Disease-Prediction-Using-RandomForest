<!DOCTYPE html>
<html lang="en">
<head>
    <title>Prediction Result | Heart Disease Prediction</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap 5 only -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background-color: #f7f9fb;
            font-size: 16px;
        }

        .result-card {
            max-width: 480px;
            margin: 10vh auto;
            background: #ffffff;
            padding: 2rem;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
        }

        .result-card h4 {
            margin-bottom: 1rem;
        }

        .result-box {
            padding: 1rem;
            margin-top: 1rem;
            border-radius: 10px;
            background-color: #eef6ff;
            font-weight: 600;
        }

        .btn-primary {
            margin-top: 1.5rem;
        }
    </style>
</head>

<body>

<div class="result-card">
    <h4>Heart Disease Prediction Result</h4>
    <p>This result is based on the medical inputs you provided.</p>

    {% if msg %}
    <div class="result-box">
        Prediction: {{ msg }} <br>
        Risk Score: {{ probability }}% <br>
        Risk Level: {{ risk }}
    </div>
    {% else %}
    <div class="result-box">
        No prediction available.
    </div>
    {% endif %}

    <a href="{{ url_for('find') }}" class="btn btn-primary w-100">
        Go Back to Prediction Form
    </a>
</div>

</body>
</html>
