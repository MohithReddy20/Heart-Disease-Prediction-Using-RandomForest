<!DOCTYPE html>
<html>
<head>
    <title>Signup - Heart Disease Prediction</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #e6f0f2, #cfd9df);
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            flex-direction: column;
        }

        .navbar {
            background-color: #ffffff;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .signup-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .signup-card {
            width: 100%;
            max-width: 420px;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.08);
            padding: 40px;
            animation: fadeIn 0.6s ease-in-out;
        }

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
}


        .signup-card h3 {
            font-weight: 700;
            margin-bottom: 25px;
            color: #1f3c4d;
        }

        .btn-primary-custom {
            background-color: #147d73;
            border: none;
            padding: 10px;
            border-radius: 8px;
        }

        .btn-primary-custom:hover {
            background-color: #11665e;
        }

        footer {
            text-align: center;
            padding: 15px;
            font-size: 13px;
            color: #6c757d;
        }
        .form-control:focus {
            border-color: #147d73;
            box-shadow: 0 0 0 0.2rem rgba(20,125,115,0.15);
        }

    </style>
</head>

<body>

<nav class="navbar navbar-expand-lg">
    <div class="container">
        <span class="navbar-brand fw-bold">Heart Disease Prediction System</span>
    </div>
</nav>

<div class="signup-container">
    <div class="signup-card">

        <h3 class="text-center">Create Account</h3>

        <form action="/signup" method="POST">

            <div class="mb-3">
                <label class="form-label">Username</label>
                <input type="text" name="un" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Email Address</label>
                <input type="email" name="em" class="form-control" required>
            </div>

            <button type="submit" class="btn btn-primary-custom w-100 mt-2">
                Sign Up
            </button>

        </form>

        {% if msg %}
<div class="alert text-center mt-3 
    {% if 'success' in msg|lower %} alert-success 
    {% else %} alert-danger {% endif %}">
    {{ msg }}
</div>
{% endif %}

        <div class="text-center mt-3">
            <small class="text-muted">
                A temporary password will be securely generated and emailed.
            </small>
        </div>

        <div class="text-center mt-3">
            <a href="{{ url_for('login') }}">Already registered? Login here</a>
        </div>

    </div>
</div>

<footer>
    Educational & Research Use Only — Not a Substitute for Professional Medical Advice
</footer>

</body>
</html>
