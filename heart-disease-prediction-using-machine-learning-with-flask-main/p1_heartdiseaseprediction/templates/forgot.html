<!DOCTYPE html>
<html>
<head>
    <title>Forgot Password - Heart Disease Prediction</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #d7e4e8, #c4d6db);
            display: flex;
            flex-direction: column;
            font-family: 'Segoe UI', sans-serif;
        }

        .navbar {
            background: #ffffff;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .auth-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .auth-card {
            width: 100%;
            max-width: 420px;
            background: #ffffff;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.08);
            animation: fadeIn 0.5s ease-in-out;
        }

        .auth-card h3 {
            font-weight: 600;
            color: #1f3c4d;
        }

        .btn-primary-custom {
            background-color: #147d73;
            border: none;
            border-radius: 8px;
            padding: 10px;
        }

        .btn-primary-custom:hover {
            background-color: #106b63;
        }

        .form-control:focus {
            border-color: #147d73;
            box-shadow: 0 0 0 0.2rem rgba(20,125,115,0.15);
        }

        footer {
            text-align: center;
            padding: 20px 0;
            font-size: 14px;
            color: #6c757d;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>

<body>

<nav class="navbar">
    <div class="container">
        <span class="navbar-brand fw-bold">Heart Disease Prediction System</span>
    </div>
</nav>

<div class="auth-wrapper">
    <div class="auth-card text-center">
        <h3 class="mb-3">Reset Password</h3>
        <p class="text-muted small mb-4">
            Enter your registered details to generate a secure temporary password.
        </p>

        <form action="/forgot" method="POST" class="text-start">
            <div class="mb-3">
                <label class="form-label">Username</label>
                <input type="text" name="un" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Email Address</label>
                <input type="email" name="em" class="form-control" required>
            </div>

            <button type="submit" class="btn btn-primary-custom w-100 mt-2">
                Generate Temporary Password
            </button>
        </form>

        {% if msg %}
        <div class="alert mt-3 text-center 
            {% if 'success' in msg|lower %} alert-success 
            {% else %} alert-danger {% endif %}">
            {{ msg }}
        </div>
        {% endif %}

        <div class="mt-3">
            <a href="{{ url_for('login') }}" class="small">
                Remembered your password? Back to login
            </a>
        </div>
    </div>
</div>

<footer>
    Educational & Research Use Only — Not a Substitute for Professional Medical Advice
</footer>

</body>
</html>
